version: "3.8"
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    volumes: ["./backend:/app", "../outbound:/app/outbound"]
    command: uvicorn main:app --host 0.0.0.0 --port 8000
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    depends_on: [backend]
    environment: ["VITE_BACKEND_URL=http://localhost:8000"]
